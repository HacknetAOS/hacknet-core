name: Hacknet Core CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo test --all --locked
      - name: Validate layout parity
        run: |
          python3 tools/hacknet-layout.py --check
          python3 tools/hacknet-layout.py --width 1366 --height 768 --check

  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: [test, clippy, fmt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo build --release --locked --all-targets
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/hacknetd dist/
          cp target/release/hacknetctl dist/
          cp target/release/hacknet-theme dist/
          tar -czvf hacknet-core-linux-x86_64.tar.gz -C dist .
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hacknet-core-binaries
          path: hacknet-core-linux-x86_64.tar.gz

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hacknet-core-binaries
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hacknet-core-linux-x86_64.tar.gz
          generate_release_notes: true

  notify-packages:
    name: Trigger Package Repo Rebuild
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch HacknetAOS/packages
        env:
          DISPATCH_TOKEN: ${{ secrets.REPO_PUSH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "REPO_PUSH_TOKEN not configured; skipping cross-repo dispatch."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/HacknetAOS/packages/dispatches \
            -d "{\"event_type\":\"source-updated\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}"
