[workspace]
members = [
    "crates/hacknet-proto",
    "crates/hacknetd",
    "crates/hacknet-theme",
    "crates/hacknetctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["HacknetOS contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
